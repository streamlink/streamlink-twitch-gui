<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Streamlink Twitch GUI</title>
    <style>
      /* Splash shown until React mounts — kills the white flash while the
         WebView waits for the JS bundle (slow in dev mode). Theme colors
         mirror global.css; light follows the OS scheme like "system" mode. */
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a1a1a;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #1a1a1a;
        color: rgba(239, 239, 241, 0.62);
        font-family: "Segoe UI", "Noto Sans", Tahoma, sans-serif;
        font-size: 13px;
        user-select: none;
      }
      #splash .spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid rgba(145, 71, 255, 0.25);
        border-top-color: #9147ff;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
        }
        html,
        body {
          background: #eef0f3;
        }
        #splash {
          background: #eef0f3;
          color: #53535f;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <div class="spinner"></div>
      <div>Streamlink Twitch GUI</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
