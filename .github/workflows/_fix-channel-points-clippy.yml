name: Fix channel points clippy

on:
  push:
    branches:
      - fix/channel-points-playback-correlation

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/channel-points-playback-correlation
      - name: Apply clippy fix
        shell: pwsh
        run: |
          $path = 'src-tauri/src/viewer_presence.rs'
          $text = Get-Content $path -Raw
          $old = @'
    let quote_index = tail.find(|character| character == '"' || character == '\'')?;
'@.TrimEnd()
          $new = @'
    let quote_index = tail.find(['"', '\''])?;
'@.TrimEnd()
          if (-not $text.Contains($old)) {
            throw 'Target clippy pattern not found.'
          }
          [System.IO.File]::WriteAllText($path, $text.Replace($old, $new))
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust
        working-directory: src-tauri
        run: cargo fmt
      - name: Commit fix
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) {
            Write-Host 'No changes required.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/viewer_presence.rs
          git commit -m 'fix: satisfy clippy in viewer presence parser'
          git push origin HEAD:fix/channel-points-playback-correlation
