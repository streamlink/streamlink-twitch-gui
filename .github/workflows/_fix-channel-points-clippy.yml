name: Fix channel points clippy

on:
  push:
    branches:
      - fix/channel-points-playback-correlation

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/channel-points-playback-correlation
      - name: Apply clippy fix
        shell: pwsh
        run: |
          $path = 'src-tauri/src/viewer_presence.rs'
          $text = Get-Content $path -Raw
          $old = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('ICAgIGxldCBxdW90ZV9pbmRleCA9IHRhaWwuZmluZCh8Y2hhcmFjdGVyfCBjaGFyYWN0ZXIgPT0gJyInIHx8IGNoYXJhY3RlciA9PSAnXCcnKT87'))
          $new = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('ICAgIGxldCBxdW90ZV9pbmRleCA9IHRhaWwuZmluZChbJyInLCAnXCcnXSk/Ow=='))
          if (-not $text.Contains($old)) { throw 'Target clippy pattern not found.' }
          [System.IO.File]::WriteAllText($path, $text.Replace($old, $new))
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust
        working-directory: src-tauri
        run: cargo fmt
      - name: Commit fix
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) { exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/viewer_presence.rs
          git commit -m 'fix: satisfy clippy in viewer presence parser'
          git push origin HEAD:fix/channel-points-playback-correlation
