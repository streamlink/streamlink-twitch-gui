name: Apply rustfmt

on:
  push:
    branches:
      - agent/channel-points-tv-session

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/channel-points-tv-session
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust
        run: |
          cd src-tauri
          cargo fmt
          cd ..
          rm .github/workflows/apply-rustfmt.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format Channel Points TV auth"
          git push origin HEAD:agent/channel-points-tv-session
