name: Trim TV auth runtime session

on:
  push:
    branches:
      - agent/channel-points-tv-session

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/channel-points-tv-session
          fetch-depth: 0
      - name: Remove unused runtime fields
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/src/channel_points_auth.rs')
          text = p.read_text(encoding='utf-8')
          old = '''pub(crate) struct ChannelPointsAuthSession {\n    pub token: String,\n    pub user_id: String,\n    pub login: String,\n    pub device_id: String,\n}\n'''
          new = '''pub(crate) struct ChannelPointsAuthSession {\n    pub token: String,\n    pub user_id: String,\n}\n'''
          if old not in text:
              raise SystemExit('ChannelPointsAuthSession block not found')
          text = text.replace(old, new, 1)
          old = '''    Ok(load_auth()?.map(|auth| ChannelPointsAuthSession {\n        token: auth.token,\n        user_id: auth.user_id,\n        login: auth.login,\n        device_id: auth.device_id,\n    }))\n'''
          new = '''    Ok(load_auth()?.map(|auth| ChannelPointsAuthSession {\n        token: auth.token,\n        user_id: auth.user_id,\n    }))\n'''
          if old not in text:
              raise SystemExit('load_session mapping not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/fix-tv-auth-clippy.yml').unlink()
          PY
          cd src-tauri
          cargo fmt
          cd ..
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: trim Channel Points TV runtime session"
          git push origin HEAD:agent/channel-points-tv-session
