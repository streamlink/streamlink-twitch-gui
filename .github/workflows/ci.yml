name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: write

jobs:
  rust-diagnostic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/twitch-web-auth
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Capture clippy output
        shell: pwsh
        working-directory: src-tauri
        run: |
          $lines = & cargo clippy -- -D warnings 2>&1
          $code = $LASTEXITCODE
          $lines | Out-File -FilePath ../docs/ci-clippy.log -Encoding utf8
          if ($code -ne 0) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ../docs/ci-clippy.log
            git commit -m "chore: capture clippy diagnostic"
            git push origin HEAD:agent/twitch-web-auth
          }
          exit $code
