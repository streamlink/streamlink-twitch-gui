name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: write

jobs:
  patch-clippy-findings:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/twitch-web-auth
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply clippy findings
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("src-tauri/src/twitch_web_auth.rs")
          content = path.read_text(encoding="utf-8")
          content = content.replace(
              '    let token = if lower.starts_with("oauth:") {\n        &trimmed[6..]\n    } else if lower.starts_with("oauth ") {\n        &trimmed[6..]\n    } else {\n        trimmed\n    };',
              '    let token = if lower.starts_with("oauth:") || lower.starts_with("oauth ") {\n        &trimmed[6..]\n    } else {\n        trimmed\n    };',
          )
          content = content.replace(
              '    loop {\n        let Some(begin) = result.find(MANAGED_BEGIN) else {\n            break;\n        };',
              '    while let Some(begin) = result.find(MANAGED_BEGIN) {',
          )
          path.write_text(content, encoding="utf-8")
          '@ | Set-Content -Path .ci-clippy-fix.py -Encoding utf8
          python .ci-clippy-fix.py
          Remove-Item .ci-clippy-fix.py
          Push-Location src-tauri
          cargo fmt
          Pop-Location
          if (git status --porcelain -- src-tauri) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src-tauri
            git commit -m "fix: address Twitch auth clippy findings"
            git push origin HEAD:agent/twitch-web-auth
          }
