name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Full Tauri build (with bundled Streamlink) runs on tags / manual dispatch later.
