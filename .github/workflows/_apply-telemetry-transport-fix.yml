name: Apply telemetry transport fix

on:
  push:
    branches:
      - fix/channel-points-telemetry-transport

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/channel-points-telemetry-transport
      - name: Apply source fix
        shell: pwsh
        run: |
          $path = 'src-tauri/src/viewer_presence.rs'
          $text = Get-Content $path -Raw
          $old = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          $new = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          if ($text.Contains($new)) {
            Write-Host 'Source fix already applied.'
            exit 0
          }
          if (-not $text.Contains($old)) {
            throw 'Target telemetry function not found.'
          }
          [System.IO.File]::WriteAllText($path, $text.Replace($old, $new))
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust
        working-directory: src-tauri
        run: cargo fmt
      - name: Commit source fix
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) { exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/viewer_presence.rs
          git commit -m 'fix: expose Twitch telemetry transport failures'
          git push origin HEAD:fix/channel-points-telemetry-transport
